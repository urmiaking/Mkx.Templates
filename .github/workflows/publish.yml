name: Publish NuGet Package
on:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
      - name: Pack template
        run: dotnet pack Mkx.Templates.Blazor.csproj -c Release -o out /p:PackageVersion=2.0.${{ github.run_number }}
      - name: NuGet login via OIDC
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: mskhodadadi
      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push out/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
